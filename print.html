<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송장 출력 - 셀러허브</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://script.google.com">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  :root{ --ink:#111; --line:#000; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Pretendard', sans-serif; background:#EEF1F5; color:var(--ink); padding:16px; font-size:12px;}
  .toolbar{max-width:460px; margin:0 auto 14px; display:flex; gap:8px;}
  .toolbar button{flex:1; border:0; border-radius:10px; padding:12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;}
  .btn-print{background:#0F1B2E; color:#fff;}
  .btn-back{background:#fff; color:var(--ink); border:1px solid #DCE1E9 !important;}
  body.embedded .toolbar{display:none;}
  .batch-note{max-width:460px; margin:0 auto 14px; font-size:12px; color:#5C6478; text-align:center;}
  /* common.js가 모든 화면에 공통으로 주입하는 다크모드 토글 버튼(우측하단 해/달 아이콘) —
     송장 출력 화면에는 어울리지 않고, 실제 인쇄 미리보기에도 겹쳐 보인다는 피드백(2026.10.01)이 있어서
     이 페이지에서는 인쇄 여부와 상관없이 항상 숨김 (예전엔 @media print 안에서만 숨겨서 화면에선 계속 보였음) */
  .theme-toggle-btn{display:none !important;}

  /* ===== [CJ] 표준운송장 규격 (123mm x 100mm, CJ 표준운송장 가이드 2025.11 개정판 준용) =====
     글꼴은 가이드 지정 "Noto Sans Korea Bold / HY견고딕" 중 웹폰트로 배포되는 Noto Sans KR(Bold/Black)을
     사용합니다(HY견고딕은 상용 폰트라 웹 임베드 불가). 각 항목 크기는 가이드 표의 pt 값을 그대로 사용해서
     실제 인쇄 시 물리 크기가 맞도록 함(브라우저 인쇄 배율이 100%일 때 기준).
     라벨 1건 = 정확히 1페이지(100mm)가 되도록, 임시번호 안내문구까지 포함해서
     .label-page 하나를 100mm로 고정하고 그 안에서 라벨이 남는 공간을 채우게 함
     (안내문구 때문에 총 높이가 100mm를 넘어가면 인쇄 시 빈 페이지가 끼어드는 문제 방지) */
  .label-page{width:123mm; height:100mm; margin:0 auto 14px; display:flex; flex-direction:column; overflow:hidden;}
  /* CJ 피드백(2026.10.01) 재확인: 실물 라벨 사진 2장(우리 출력 vs CJ 실제 발송 라벨)을 픽셀 단위로 겹쳐서
     비교한 결과, 라벨 테두리(검은 실선)는 실물 라벨에는 아예 없음 — 용지 가장자리까지 그냥 흰 배경임.
     이전엔 .label에 border를 그려서 인쇄 시 우리만 라벨 테두리가 생겼던 것. */
  .label{width:123mm; flex:1; min-height:0; background:#fff;
    font-family:'Noto Sans KR', 'Pretendard', sans-serif; font-weight:700;
    font-size:9pt; display:flex; flex-direction:column; overflow:hidden; padding:1mm 3mm;}

  /* 항목1~4: 운송장번호 / 접수일자 / 출력매수 / 재출력여부
     CJ 공식 운송장 양식 가이드 PDF(123x100mm 다이어그램+항목표)를 직접 열어서 확인(2026.10.01) —
     1(운송장번호)~4(재출력여부)는 가이드 샘플 이미지에서 전부 한 줄에 나란히 배치돼있음.
     어제(10.01) 사진 비교만으로 "1/1을 별도 줄로 빼야 한다"고 바꿨던 게 가이드와 어긋나 원복함.
     가이드 다이어그램 좌측 세로 치수를 직접 재서 확인(2026.10.01): 라벨 100mm 높이가 위에서부터
     10(헤더)+15(구역바코드)+20(받는분)+7(보내는분)+33(상품~준수사항)+15(푸터) = 100mm로 정확히 떨어짐.
     이 비율을 각 블록의 "최소" 높이(min-height)로 반영해서 실제 비율이 가이드 샘플과 최대한 가깝도록 함.
     (가로 치수 "6,3,30,2,5,35,10"은 라벨 전체 폭이 아니라 헤더 한 줄 내부 간격이었고, 가이드 하단에
     "분류코드/바코드 공간 간격은 참고사항, 겹치지 않고 바코드 리딩 이슈 없게만 하라"고 명시돼 있어서
     실제 주문마다 달라지는 글자수(운송장번호, 날짜 등) 때문에 그 숫자들을 픽셀 단위로 고정하진 않음)
     ⚠️ 2026.10.01 실인쇄 피드백: flex-basis(고정 높이)로 박았더니 실제 폰트(Noto Sans KR 웹폰트, 로컬
     테스트의 폴백 폰트보다 줄간격이 더 큼)로는 받는분(20mm)/보내는분(7mm) 블록 내용이 할당량보다 커져서,
     align-items:center로 위아래 블록에 걸쳐 튀어나온 부분끼리 겹쳐 찍히는 사고가 실제로 발생함
     (주소약칭 "원천 627 테라타워" 줄과 보내는분 "수량/운임/정산" 줄이 겹쳐 인쇄됨).
     그래서 전부 flex-basis(고정) 대신 min-height(최소값)로 바꿈 — 가이드 비율은 그대로 하한선으로
     유지하되, 실제 내용이 더 필요하면 박스가 늘어나서 다음 블록을 밀어낼지언정 절대 겹치지 않게 함.
     ⚠️ 2026.10.01 추가 피드백: 그런데 min-height를 가이드 비율(10/7/15mm) 그대로 두니 글자가 작은
     헤더/보내는분/푸터 블록은 내용보다 훨씬 커서 빈 여백만 생기고, 그 빈 여백들이 쌓여서 라벨 전체
     내용이 아래로 쳐져 보인다는 피드백을 받음("전체적으로 아래로 내려갔어 올려"). 큰 글씨(24pt/53pt)가
     있어서 실제로 여유가 필요한 구역바코드(.l-zonebar)/받는분(.l-to)만 min-height를 남기고,
     글자가 작아서 애초에 겹칠 위험이 없는 헤더/보내는분/푸터는 min-height를 빼고 내용 크기 그대로
     (딱 필요한 만큼만) 차지하게 해서 전체적으로 위로 당김. */
  .l-head{flex-shrink:0; box-sizing:border-box; display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid #AFCBE8; gap:2mm;}
  .l-head .no-label{color:#3E7FC1; font-size:8pt; font-weight:700; margin-right:1.5mm; vertical-align:top;}
  .l-head .no-value{font-weight:900; font-size:12pt; letter-spacing:0.3px;}
  .l-head .date{color:#333; font-size:8pt; font-weight:700;}
  .l-head .page{color:#888; font-size:8pt;}
  .l-head .reprint{color:#B34700; font-size:8pt; font-weight:700;}

  /* 항목5(분류코드바코드) / 항목6(분류코드 텍스트, 가이드 표 크기 36+53+36pt 그대로 적용) / 항목19(특수문자1, 30pt)
     지역에 따라 대분류/서브코드 자릿수가 가이드 샘플("4W44-4g")보다 훨씬 길게 오는 경우가 실제로 있어서
     (예: 대분류 6자리+서브 2자리), 고정 pt 크기 그대로면 폭을 넘어 잘려버림. 그래서 폭이 넘칠 때만
     JS(fitZoneCode)가 transform:scale로 전체를 비율 유지한 채 줄여서 절대 잘리지 않게 함. */
  /* 가이드 좌측 세로치수 기준 이 블록의 "기본" 높이는 15mm인데, 우측에 별도로 "26mm" 치수가
     따로 표기돼있는 걸 확인함(2026.10.01) — 이건 분류코드 서브코드 첫 글자(53pt)가 받는분
     이름줄 쪽으로 자연스럽게 침범(bleed)하는 걸 CJ 샘플도 전제하고 있다는 뜻(항목6 비고란
     "SUBCLSFCD 값 중 'g'의 운송장바코드 침범으로 위치 조정 필수"와 일치). 그래서 기본 15mm
     그대로 고정하지 않고, 기존에 실인쇄 테스트로 이미 검증된 19mm(15mm+안전여유)를 유지해서
     53pt 글자가 잘리지 않도록 함 — 사용자 요청대로 "실물과 약간 다를 수 있으니 여유공간은 둔다".
     (받는분/보내는분 블록과 같은 이유로 flex-basis 고정이 아니라 min-height로 — 19mm보다 더 필요하면
     늘어나게 해서 절대 잘리지 않게 함) */
  .l-zonebar{flex-shrink:0; min-height:19mm; box-sizing:border-box; display:flex; align-items:flex-start; gap:2mm; padding:0.3mm 0; overflow:hidden;}
  /* 사용자가 가이드 이미지를 치수선과 함께 직접 재확인한 결과 분류코드바코드(항목5)는
     높이 15mm·길이 30mm가 맞음(2026.10.03).
     ⚠️ 중요한 발견: 처음엔 이 바코드를 <svg>로 그리고 CSS height/width로 크기를 지정했는데,
     실제 인쇄 PDF로 뽑아서 재봤더니(화면 미리보기/getBoundingClientRect로는 정확해 보였음에도)
     flex 아이템인 svg는 Chromium 인쇄 렌더링 경로에서 CSS로 지정한 크기를 무시하고 원래 네이티브
     크기로 찍히는 버그가 있었음 — 그래서 사용자가 "왜이리 작아" 지적한 게 실제로 반영이 안 되고
     있었던 것. svg 대신 <canvas>로 그린 뒤 PNG로 변환해 <img>로 넣는 방식으로 바꾸니 화면/인쇄
     렌더링 경로 둘 다에서 CSS 크기가 정확히 적용됨(아래 drawBarcodes 참고) — 그래서 바코드
     엘리먼트를 svg에서 img로 교체함. */
  .l-zonebar .zc-barcode{height:15mm; width:30mm; flex-shrink:0; display:block;}
  /* overflow(자르기)와 transform:scale(축소)를 같은 요소에 같이 걸면 브라우저가 "자르기"를
     축소 이전(레이아웃 단계) 크기 기준으로 먼저 적용해버려서, 정작 축소해도 잘린 채로 남는 문제가 있었음
     (실제 테스트로 확인). 그래서 자르는 역할(overflow:hidden, 폭 계산)은 바깥 래퍼(.l-zone-code)가,
     축소 역할(transform:scale)은 안쪽 래퍼(.l-zone-code-inner)가 나눠서 맡도록 분리함. */
  .l-zone-code{display:flex; overflow:hidden; margin-left:auto; justify-content:flex-end;}
  .l-zone-code-inner{display:flex; align-items:baseline; line-height:0.85; white-space:nowrap; font-weight:900; transform-origin:right center;}
  .l-zone-code-inner .zc-major{font-size:36pt;}
  .l-zone-code-inner .zc-dash{font-size:36pt; margin:0 0.5mm;}
  .l-zone-code-inner .zc-sub1{font-size:53pt;}
  .l-zone-code-inner .zc-sub2{font-size:36pt;}
  .l-zone-code-inner .zc-special{font-size:30pt; margin-left:2mm;}

  /* CJ 공식 운송장 양식 가이드 PDF를 직접 열어서 확인(2026.10.01) — 가이드 샘플 다이어그램에 명확히
     7(성명/전화, 바코드가 같은 줄 우측에 붙음) → 9(받는분주소, 작은글씨, 2줄) → 10(주소약칭, 큰글씨)
     순서로 나와있음. 어제(10.01) 사진 두 장만 보고 "10+바코드 → 7 → 9"로 뒤집었던 게 가이드와 어긋나서
     원복함 — 사진은 참고용일 뿐, 공식 가이드 다이어그램이 우선. */
  /* 바코드(9mm)를 이름/전화번호 줄과 같은 flex row에 넣고 align-items:center로 맞췄더니, 그 줄
     높이가 바코드 높이(9mm)에 맞춰지면서 정작 10pt 글자 위아래로 빈 공간이 많이 남았음 — 실제
     인쇄물에서 "인쇄테스트 위에 빈 공간, 아래 한 줄 뜨고 주소" 로 사용자가 지적(2026.10.02).
     CJ 가이드 샘플도 실제로는 바코드가 이름줄+주소줄 두 줄 높이에 걸쳐 오른쪽에 떠있는 구조라,
     flex 대신 float:right로 바꿔서 이름/주소 텍스트가 바코드 옆을 자연스럽게 감싸고 올라붙게 함
     (float는 꽉 채워야 하는 만큼만 공간을 차지해서 텍스트 줄 사이에 인위적인 빈 공간이 안 생김). */
  /* 2026.10.03: 사용자가 가이드 이미지를 치수선과 함께 직접 재확인 — 상단 운송장번호바코드(항목8)는
     높이 5mm, 길이 35mm가 맞음(9mm는 잘못 읽은 것이었음). height를 9→5mm로 낮추고, width는
     길이가 35mm로 나오도록 비례 재계산해서 올림(1.45 * (35/5)/(38.5/9) ≈ 2.37). */
  /* 분류코드바코드와 같은 svg+CSS 인쇄 버그 대상이라 img/canvas 방식으로 교체함(가로 35mm·세로 5mm 고정). */
  .top-tracking-barcode{height:5mm; width:35mm; float:right; margin-left:2mm; display:block;}
  /* 주소약칭(항목10) 글자수가 주문마다 달라서(예: "원천 627 테라타워" vs "두산위브 상가동 208호") 폭을 넘기 쉬움
     → 분류코드와 같은 방식(넘칠 때만 축소)으로 처리. clear:both로 위 바코드(float) 아래에서 항상
     전체 폭을 쓰도록 강제 — 안 그러면 바코드 옆 좁은 공간 안에서 축소 계산이 꼬일 수 있음. */
  .l-to-detail-clip{overflow:hidden; min-width:0; margin-top:0.3mm; clear:both;}

  /* "받는분"/"보내는분" 캡션은 실물 CJ 송장 용지 왼쪽 끝에 파란색으로 이미 인쇄돼있어서(실물 인쇄 확인 완료)
     텍스트를 중복 출력하지 않음 — 단, 그 자리는 실물 용지 인쇄 위치와 겹치지 않도록 여백만 그대로 비워둠.
     실제 인쇄물을 자로 재보니(2026.10.02) 그 파란 캡션 폭은 약 5mm인데 9mm를 비워뒀던 거라 캡션과
     글자 사이에 불필요한 빈 여백이 있었음 — 5.5mm로 줄임(약간의 안전 여유만 남김). */
  .l-block{display:flex; align-items:center; border-top:1px solid #ccc; padding-left:5.5mm; box-sizing:border-box;}

  /* 항목7(받는분성명/전화번호, 10pt) / 항목9(받는분주소, 9pt) / 항목10(주소약칭, 24pt, CJ 주소정제 API의 CLSFADDR값)
     가이드 좌측 세로치수 기준 받는분 블록 높이는 20mm인데, min-height로만 반영함(flex-basis 고정 X) —
     실제 웹폰트 줄간격으로는 20mm를 넘기기 쉬워서, 고정하면 다음 블록(보내는분)과 겹쳐 찍히는 사고가
     실제로 발생했음(2026.10.01). min-height면 모자랄 때만 20mm, 넘치면 자연스럽게 늘어나 아래 블록을
     밀어내기만 하고 절대 겹치지 않음. */
  .l-to{flex-shrink:0; min-height:20mm;}
  .l-to-main{flex:1; min-width:0;}
  /* 2026.10.03: 수취인명/연락처가 마스킹 후 길어지면(예: "인쇄테스****  010-1234-****") 바코드
     옆 남은 폭을 넘겨서 전화번호가 다음 줄로 줄바꿈되는 문제가 실제 인쇄로 확인됨 — 주소약칭(항목10)/
     구역명(항목18)과 같은 "넘칠 때만 축소" 패턴 적용. 바깥(.l-to-nameline-clip)은 플로트 바코드 옆에
     남는 폭만큼만 자동으로 차지하고(overflow:hidden으로 줄바꿈 대신 자르기), 안쪽(.l-to-nameline)은
     white-space:nowrap으로 한 줄 유지하면서 넘치면 JS(shrinkToFit)가 비율 유지한 채 축소. */
  .l-to-nameline-clip{overflow:hidden;}
  .l-to-nameline{font-size:10pt; color:#222; font-weight:700; white-space:nowrap; transform-origin:left center;}
  .l-to-fulladdr{font-size:9pt; color:#444; margin-top:0.3mm; line-height:1.15; font-weight:500;}
  /* 가이드 표 기준 주소약칭(항목10)은 24pt — 19개 항목 전수 재확인(2026.09.30) 중 20pt로 돼있던 걸 발견해 수정 */
  .l-to-detail{font-size:24pt; font-weight:900; line-height:0.95; white-space:nowrap; transform-origin:left center;}

  /* 항목11(보내는분성명/전화번호, 가이드 표 기준 7pt) / 항목12~14(운임그룹조정+수량/운임/운임구분, 10pt) / 항목15(보내는분주소)
     "받는분"/"보내는분" 캡션과 마찬가지로 "수량"/"운임"/"정산" 캡션도 실제로 쓰는 CJ 공백 운송장 용지에
     이미 파란색으로 인쇄돼있다는 걸 사용자가 확인해줌(2026.10.01) — 가이드 PDF의 샘플 이미지는 그 캡션까지
     포함한 "완성본" 미리보기였을 뿐, 우리 소프트웨어가 직접 찍어야 하는 항목이 아니었음. 그래서 캡션은
     빼고 값만 출력(수량/운임/정산 → 숫자·"신용"만). 보내는분 이름 글씨 크기는 가이드 표 그대로 7pt 유지. */
  /* 가이드 좌측 세로치수 기준 보내는분 블록 높이는 7mm지만, 글자가 7~10pt라 실제로는 그보다 작게
     차지함 — min-height를 강제하면 빈 여백만 생겨 전체 내용이 아래로 쳐져 보여서(2026.10.01 피드백)
     min-height 없이 내용 크기 그대로 둠(겹칠 위험도 없는 블록이라 안전함) */
  .l-from{flex-shrink:0;}
  .l-from-main{flex:1; min-width:0;}
  /* 수량/운임/정산 값(1/0/신용)은 실물 용지에 이미 찍혀있는 "수량"/"운임"/"정산" 파란 캡션 바로 옆에
     들어가야 하는데, 그 캡션들은 보내는분 성명/전화번호 글자 길이와 무관하게 용지 고정 위치에 인쇄돼있음.
     그래서 이름 옆에 자연스럽게 붙이는 flex 방식(예전 justify-content:space-between으로 맨 오른쪽 끝에
     몰아두던 방식) 대신, CJ 공식 가이드 PDF 샘플 이미지를 픽셀 단위로 측정해 라벨(123mm) 기준 캡션 위치를
     mm로 환산한 뒤, 보내는분 줄(.l-from-top) 왼쪽 끝(라벨 왼쪽 끝에서 패딩 3mm+받는분/보내는분 캡션칸
     9mm = 12mm 지점)을 기준으로 absolute 좌표를 줘서 이름 길이와 상관없이 항상 같은 자리에 찍히게 함
     (2026.10.02, 실제 인쇄물 사진에서 "수량" 라벨과 주소약칭 큰 글씨가 겹쳐 보인다는 피드백 반영 —
     값 위치를 왼쪽으로 당겨 각 라벨 바로 옆에 오도록 재조정). 가이드도 "참고사항"이라 했으므로 라벨 폭에
     약간의 여유(0.3mm 안쪽 패딩 없이 값 폭만큼만)를 두고 overflow는 클립하지 않음. */
  .l-from-top{display:flex; align-items:center; position:relative;}
  .l-from-name{font-weight:700; font-size:7pt;}
  .l-from-chips{position:absolute; left:0; top:50%; width:100%; transform:translateY(-50%); font-size:10pt; font-weight:700; white-space:nowrap;}
  .l-from-chips .chip-qty{position:absolute; left:56mm;}
  .l-from-chips .chip-fee{position:absolute; left:81mm;}
  .l-from-chips .chip-settle{position:absolute; left:100mm;}
  .l-from-bottom{display:flex; justify-content:space-between; align-items:baseline; margin-top:0.3mm; gap:2mm;}
  .l-from-addr{font-size:8pt; color:#333; font-weight:500; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .l-from-phone{font-size:7pt; color:#222; font-weight:700;}
  .l-from-recv-repeat{font-size:7pt; color:#777; font-weight:500; flex-shrink:0; white-space:nowrap;}

  /* 항목16(상품명) — 상품이 여러 개라 텍스트가 길어져도 하단 footer(바코드/구역명 등)를
     절대 밀어내거나 겹치지 않도록, 최대 2줄까지만 표시하고 그 이상은 말줄임(...) 처리.
     (라벨 공간이 고정(100mm)이라 무제한으로 늘어나면 footer가 잘리거나 겹칠 수 있어서
     '잘리는 것'보다 '보기 좋게 줄이는 것'을 선택함) */
  .l-product{font-size:9pt; color:#111; font-weight:700; padding:0.6mm 0; line-height:1.2; border-top:1px dashed #ccc; flex-shrink:0;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; max-height:calc(1.2em * 2 + 1.2mm);}

  /* 실물 CJ 송장 용지에 GRP/ONE 준수사항 문구(고객님의 소중한 상품을.../개인정보 유출우려...)가
     이미 인쇄돼있는 것을 실물 인쇄로 확인함(2026.09.29) → 중복 출력 제거. 필요시를 대비해 클래스는
     남겨두되(.l-compliance) 실제 HTML에서는 더 이상 사용하지 않음. */

  /* 항목17(배송메세지) — 상품명과 같은 이유로 1줄까지만 표시하고 넘으면 말줄임 처리 */
  .l-delivery-msg{font-size:8pt; color:#555; font-weight:500; padding:0.3mm 0; line-height:1.15; flex-shrink:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .l-spacer{flex:1 1 auto;}

  /* 항목18(배달점소-별칭) / 항목8 하단(운송장번호바코드)
     CJ 공식 가이드 PDF 기준 항목18은 18pt가 맞음 — 어제(10.01) 실제 인쇄 테스트에서 18pt일 때
     구역명이 길면 줄바꿈되며 윗줄을 침범하는 버그를 보고 12pt로 줄였던 건데, 가이드 사양을 깨는 임시방편이었음.
     대신 분류코드(zc)/주소약칭(항목10)과 같은 "넘칠 때만 축소" 패턴을 적용해서 18pt를 유지하면서도
     길어지면 안전하게 줄어들게 함(.l-footer-zone-clip 바깥 래퍼 + .l-footer-zone 안쪽 축소 대상).
     받는분 주소약칭(항목10) 반복 표시줄(.l-footer-repeat)은 실물 라벨에 실제로 있는 걸 확인해서 유지.
     "운임"/"정산" 캡션은 l-from-chips와 같은 이유로 실물 용지에 이미 인쇄돼있어 값만 출력(2026.10.01). */
  /* 가이드 좌측 세로치수 기준 푸터 블록 높이는 15mm지만, 항목18(18pt)이 제일 큰 글자라 실제로는
     그보다 작게 차지함 — l-from과 같은 이유로 min-height 없이 내용 크기 그대로 둠 */
  .l-footer{flex-shrink:0; box-sizing:border-box; display:flex; justify-content:space-between; align-items:flex-end; border-top:1.5px solid #000; padding-top:0.6mm;}
  .l-footer-left{flex:1; min-width:0; overflow:hidden;}
  .l-footer-repeat{font-size:8pt; color:#555; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .l-footer-zone-clip{overflow:hidden; min-width:0;}
  .l-footer-zone{font-size:18pt; font-weight:900; line-height:1; white-space:nowrap; transform-origin:left center;}
  .l-footer-mid{text-align:right; margin-right:3mm; flex-shrink:0;}
  .l-footer-qty{font-size:10pt; font-weight:700;}
  .l-footer-page{font-size:8pt; color:#888;}
  .l-footer-chips{font-size:9pt; color:#3E7FC1; font-weight:700;}
  .l-footer-right{text-align:center; flex-shrink:0;}
  /* 이것도 flex 아이템 svg+CSS 크기지정 인쇄 버그 대상이라 img/canvas 방식으로 교체함(2026.10.03). */
  .l-footer-right img{height:9mm; width:34mm; display:block; margin:0 auto;}
  .l-footer-tracking{font-size:9px; letter-spacing:0.5px; margin-top:0.5mm; font-family:'Pretendard', sans-serif;}

  .temp-notice{width:123mm; flex-shrink:0; background:#FFF6E5; color:#8a5c14; font-size:10px; font-weight:700; padding:4px 10px; text-align:center; box-sizing:border-box; font-family:'Pretendard', sans-serif;}

  .loading, .error-box{max-width:460px; margin:40px auto; text-align:center; color:#5C6478; font-size:13px;}

  .auth-overlay{position:fixed; inset:0; background:rgba(13,20,32,0.55); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;}
  .auth-overlay.show{display:flex;}
  .auth-card{background:#fff; border-radius:16px; padding:28px 24px; max-width:300px; width:100%;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.25);}
  .auth-card .auth-brand{font-size:12px; letter-spacing:0.1em; color:#E8A33D; font-weight:700; margin-bottom:14px;}
  .auth-card h2{font-size:16px; margin:0 0 6px;}
  .auth-card p{font-size:12.5px; color:#5C6478; margin:0 0 18px;}
  #googleSignInBtn{display:flex; justify-content:center;}
  body.auth-locked > *:not(.auth-overlay){filter:blur(3px); pointer-events:none;}

  @media print {
    @page { size: 123mm 100mm; margin: 0; }
    body{background:#fff; padding:0; margin:0;}
    .toolbar, .batch-note{display:none;}
    .theme-toggle-btn{display:none !important;}
    .label-page{margin:0; page-break-after:always; page-break-inside:avoid;}
    .label-page:last-child{page-break-after:auto;}
    .temp-notice{width:auto;}
  }
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-brand"><span class="dot"></span>SELLER HUB</div>
    <h2>로그인이 필요해요</h2>
    <p>등록된 구글 계정으로 로그인해야 주문 데이터를 볼 수 있어요</p>
    <div id="googleSignInBtn"></div>
  </div>
</div>

<div class="toolbar">
  <button class="btn-back" onclick="window.close ? window.close() : history.back()">닫기</button>
  <button class="btn-print" onclick="window.print()">🖨 인쇄하기</button>
</div>

<div id="content" class="loading">불러오는 중...</div>

<script src="common.js"></script>
<script>
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  if (getParam('embedded') === '1') {
    document.body.classList.add('embedded');
  }

  // 운송장 마스킹 규칙 (2025.10 국토교통부 배포 마스킹 기본 규칙 권고안 반영)
  // 국문 이름: 첫 번째/세 번째 글자만 노출, 나머지는 전부 마스킹 (길이 제한 없이 계속 마스킹, 자르지 않음)
  //   예) 홍길 → 홍*, 홍길동 → 홍*동, 홍길동홍 → 홍*동*
  // 국문 외(영문 등) 이름: 네 글자까지는 국문과 동일한 방식, 다섯 글자부터는 네 번째 글자까지 노출 후 나머지 마스킹
  //   예) AB → A*, ABC → A*C, ABCD → A*C*, ABCDE → ABCD*, ABCDEFG → ABCD***
  function maskName(name) {
    const s = String(name || '').replace(/\s+/g, '');   // 공백은 글자 수에서 제외
    if (!s) return '-';
    if (s.length === 1) return s;
    if (s.length === 2) return s[0] + '*';
    const isKorean = /^[가-힣]+$/.test(s);
    if (isKorean || s.length <= 4) {
      return s.split('').map((ch, i) => (i === 0 || i === 2) ? ch : '*').join('');
    }
    return s.slice(0, 4) + '*'.repeat(s.length - 4);
  }

  // 전화번호: 마지막 4자리 마스킹
  function maskPhone(phone) {
    const digits = String(phone || '').replace(/[^0-9]/g, '');
    if (digits.length < 8) return '-';
    const raw = String(phone);
    return raw.slice(0, raw.length - 4) + '****';
  }

  function formatTrackingDisplay(trackingNo) {
    const s = String(trackingNo || '');
    if (s.length === 12) return s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
    return s;
  }

  // CJ 가이드(FAQ 1.4.10) 권장 방식: 전체주소 앞에서 세 번째 공백 기준으로 기본주소/상세주소 분리
  // 예) "서울특별시 용산구 테스트로 123 그레이스 아파트 106동 123호"
  //     -> 기본: "서울특별시 용산구 테스트로 123" / 상세: "그레이스 아파트 106동 123호"
  function splitAddressForLabel(fullAddr) {
    const s = String(fullAddr || '').trim();
    if (!s) return { base: '', detail: '' };
    const parts = s.split(/\s+/);
    if (parts.length <= 3) return { base: s, detail: '' };
    return { base: parts.slice(0, 3).join(' '), detail: parts.slice(3).join(' ') };
  }

  // 분류코드(대분류코드+서브코드)/배송구역명/권내배송코드는 CJ 주소정제 API(ReqAddrRfnSm) 연동이
  // 완료돼야 실제 값을 받을 수 있어요. 아직 연동 전(과거 주문 등)이면 자리만 맞춰두고 '-'로 표시합니다.
  function getZoneInfo(order) {
    return {
      majorCode: order['송장_대분류코드'] || '',
      subCode: order['송장_서브코드'] || '',
      zoneName: order['송장_배송구역'] || '',
      inZoneCode: order['송장_권내배송코드'] || '',
      addrAbbrev: order['송장_주소약칭'] || ''  // 항목10: CJ 주소정제 API의 CLSFADDR값 (백엔드 연동 전 주문은 빈값)
    };
  }

  // 항목6(분류코드 텍스트) + 항목19(특수문자1/권내배송코드)를 CJ 표준운송장 가이드 표에 적힌
  // 글자크기 그대로 렌더링 (대분류 36pt + 서브코드 첫 글자 53pt + 나머지 36pt + 특수문자 30pt).
  // 서브코드 첫 글자만 확대하는 규칙은 가이드에 실제로 포함된 샘플 이미지("4W44-4g")를 보고 그대로 반영한 거예요.
  function renderZoneCodeHtml(zone) {
    const major = esc(zone.majorCode) || '';
    const sub = String(zone.subCode || '');
    const subFirst = esc(sub.slice(0, 1));
    const subRest = esc(sub.slice(1));
    if (!major && !sub) return '<span class="zc-major">-</span>';
    let html = `<span class="zc-major">${major || '-'}</span>`;
    if (sub) {
      html += `<span class="zc-dash">-</span><span class="zc-sub1">${subFirst}</span><span class="zc-sub2">${subRest}</span>`;
    }
    if (zone.inZoneCode) {
      html += `<span class="zc-special">${esc(zone.inZoneCode)}</span>`;
    }
    return html;
  }

  function renderLabel(order, store, idx, total) {
    const trackingNo = String(order['송장_송장번호'] || '');
    const isTemp = trackingNo.indexOf('999') === 0 || trackingNo.indexOf('998') === 0;
    const isFreshTemp = trackingNo.indexOf('998') === 0;
    const barcodeIdMajor = 'barcode_major_' + idx;       // 항목5: 분류코드바코드(대분류코드만, CODE128A)
    const barcodeIdTopTracking = 'barcode_toptrk_' + idx; // 항목8(상단): 운송장번호바코드(CODE128C)
    const barcodeIdFooter = 'barcode_footer_' + idx;      // 항목8(하단): 운송장번호바코드(CODE128C)
    const dateStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\. /g, '.').replace(/\.$/, '');
    const trackingDigits = trackingNo.replace(/[^0-9]/g, '');

    // 항목9(받는분주소)는 가이드 기준 "받는분주소 + 주소2 + 상세주소"를 합쳐서 보여줘야 하는데,
    // 상세주소(구매자주소상세, 예: 동/호수)가 빠져있던 버그를 수정 (CJ 파트너 테스트 피드백 반영, 2026.09.30)
    const toFullAddr = [order['구매자주소'], order['구매자주소상세']].filter(Boolean).join(' ').trim();
    const { base: toBase, detail: toDetail } = splitAddressForLabel(toFullAddr);
    const zone = getZoneInfo(order);
    const maskedName = maskName(order['구매자명']);
    const maskedPhone = maskPhone(order['구매자연락처']);

    let productLine = `${esc(order['상품명']) || '-'} 외 ${formatWon(order['수량'])}개`;
    if (order['품목목록JSON']) {
      try {
        const items = JSON.parse(order['품목목록JSON']);
        if (items.length > 1) {
          productLine = items.map(it => `${esc(it.productName)} x${formatWon(it.quantity)}`).join(', ');
        }
      } catch (e) {}
    }

    return `
      <div class="label-page">
      ${isTemp ? `<div class="temp-notice">⚠ 임시 송장번호(${isFreshTemp ? '신선배송' : '일반배송'}) - 실제 접수 시 택배사 번호로 교체돼요</div>` : ''}
      <div class="label">
        <div class="l-head">
          <div><span class="no-label" style="visibility:hidden">운송장번호</span><span class="no-value">${esc(formatTrackingDisplay(trackingNo)) || '-'}</span></div>
          <div class="date">${esc(dateStr)}</div>
          <div class="page">${idx + 1}/${total}</div>
          <div class="reprint">-</div>
        </div>

        <div class="l-zonebar">
          <img class="zc-barcode" id="${barcodeIdMajor}" alt="">
          <div class="l-zone-code"><div class="l-zone-code-inner">${renderZoneCodeHtml(zone)}</div></div>
        </div>

        <div class="l-block l-to">
          <div class="l-to-main">
            <img class="top-tracking-barcode" id="${barcodeIdTopTracking}" alt="">
            <div class="l-to-nameline-clip"><div class="l-to-nameline">${esc(maskedName)}　${esc(maskedPhone)}</div></div>
            <div class="l-to-fulladdr">${esc(toFullAddr) || '-'}</div>
            <div class="l-to-detail-clip"><div class="l-to-detail">${esc(zone.addrAbbrev) || esc(toDetail) || esc(toBase) || '-'}</div></div>
          </div>
        </div>

        <div class="l-block l-from">
          <div class="l-from-main">
            <div class="l-from-top">
              <span class="l-from-name">${store.name ? esc(store.name) : '(내정보에서 출고지 정보를 설정해주세요)'}　${esc(store.phone) || '-'}</span>
              <span class="l-from-chips">
                <span class="chip-qty">${formatWon(order['수량'])}</span>
                <span class="chip-fee">0</span>
                <span class="chip-settle">신용</span>
              </span>
            </div>
            <div class="l-from-bottom">
              <span class="l-from-addr">${esc(store.address) || ''}${store.addressDetail ? ' ' + esc(store.addressDetail) : ''}</span>
              <span class="l-from-recv-repeat">받는분: ${esc(maskedName)} / ${esc(maskedPhone)}</span>
            </div>
          </div>
        </div>

        <div class="l-product">${productLine}</div>

        <div class="l-delivery-msg">${esc(order['배송메세지']) || ''}</div>

        <div class="l-spacer"></div>

        <div class="l-footer">
          <div class="l-footer-left">
            <div class="l-footer-repeat">${esc(zone.addrAbbrev) || esc(toDetail) || esc(toBase) || ''}</div>
            <div class="l-footer-zone-clip"><div class="l-footer-zone">${esc(zone.zoneName) || '-'}</div></div>
          </div>
          <div class="l-footer-mid">
            <div class="l-footer-qty">총수량 : ${formatWon(order['수량'])}</div>
            <div class="l-footer-page">(${idx + 1}/${total})</div>
            <div class="l-footer-chips">0　신용</div>
          </div>
          <div class="l-footer-right">
            <img id="${barcodeIdFooter}" alt="">
            <div class="l-footer-tracking">${esc(trackingDigits) || '-'}</div>
          </div>
        </div>
      </div>
      </div>
    `;
  }

  function drawBarcodes(orders) {
    orders.forEach((o, idx) => {
      const trackingNo = String(o['송장_송장번호'] || '');
      const majorCode = String(o['송장_대분류코드'] || '').replace(/\s+/g, '');

      // 2026.10.03: svg를 바로 그려서 CSS height/width로 크기를 맞추던 방식은 화면 미리보기에서는
      // 정확해 보여도 실제 인쇄 PDF에서는 flex 아이템인 svg가 CSS 크기 지정을 무시하고 원래
      // 네이티브 크기로 찍히는 Chromium 버그가 있었음(실인쇄로 확인) — 그래서 "분류코드 바코드가
      // 너무 작다", "운송장번호 바코드 길이가 안 맞는다" 등 화면상 멀쩡해 보이는데 실제 인쇄만
      // 어긋나는 문제가 반복됐음. <canvas>에 그린 뒤 PNG로 변환해 <img>에 넣는 방식으로 바꾸면
      // 화면/인쇄 렌더링 경로 둘 다에서 CSS width/height가 정확히 적용되는 걸 실제 인쇄 PDF로
      // 재검증 완료 — 그래서 최종 물리 크기는 전부 CSS(위 .zc-barcode/.top-tracking-barcode/
      // .l-footer-right img)가 결정하고, 여기 JsBarcode 호출의 width/height는 그 크기에 찍기
      // 전 막대 밀도(인쇄 품질)만 정하는 값이라 정확히 맞출 필요 없음.
      function drawToImg(imgId, value, format, width, height) {
        const img = document.getElementById(imgId);
        if (!img) return;
        const canvas = document.createElement('canvas');
        try {
          JsBarcode(canvas, value, { format, width, height, displayValue: false, margin: 0 });
        } catch (e) {
          try {
            JsBarcode(canvas, value, { format: 'CODE128', width, height, displayValue: false, margin: 0 });
          } catch (e2) { return; /* 바코드로 표현 불가한 값이면 조용히 스킵 */ }
        }
        img.src = canvas.toDataURL('image/png');
      }

      // 항목5: 분류코드바코드 - 대분류코드만 단독으로, CODE128A(대문자/숫자 전용) 인코딩
      // 가이드 이미지를 치수선과 함께 재확인한 결과 높이 15mm/길이 30mm가 맞음 — CSS가 최종 크기를
      // 고정하므로 여기 width/height는 인쇄 밀도용 값일 뿐.
      if (majorCode) {
        drawToImg('barcode_major_' + idx, majorCode, 'CODE128A', 1.46, 34);
      }

      if (!trackingNo) return;
      // 항목8(상단/하단 두 곳): 운송장번호바코드 - CODE128C(숫자 전용, 2자리씩 압축) 인코딩 시도,
      // 자릿수가 홀수 등으로 실패하면 일반 CODE128로 폴백. 상단 바코드는 가이드 기준 높이 5mm/길이
      // 35mm, 하단 footer 바코드는 기존 그대로(9mm/34mm) — 둘 다 CSS가 최종 크기를 고정함.
      drawToImg('barcode_toptrk_' + idx, trackingNo, 'CODE128C', 1.32, 34);
      drawToImg('barcode_footer_' + idx, trackingNo, 'CODE128C', 1.3, 34);
    });
  }

  // 글자수가 주문마다 달라지는 항목(분류코드, 주소약칭 등)이 고정 폰트 크기로는 폭을 넘어
  // 잘리거나(overflow:hidden) 줄바꿈되는 문제가 실물 인쇄에서 실제로 확인됨(2026.09.29).
  // 넘칠 때만 transform:scale로 전체 비율을 유지한 채 줄여서 절대 잘리거나 줄바꿈되지 않도록 함.
  // (outerSelector = 폭을 재는/자르는 바깥 래퍼, innerSelector = 그 안에서 실제로 축소될 안쪽 래퍼.
  //  자르기와 축소를 같은 요소에 걸면 축소 전 크기 기준으로 이미 잘려버리는 문제가 있어 분리함)
  function shrinkToFit(outerSelector, innerSelector) {
    document.querySelectorAll(outerSelector).forEach(outer => {
      const inner = outer.querySelector(innerSelector);
      if (!inner) return;
      inner.style.transform = 'none';
      const available = outer.clientWidth;
      const needed = inner.scrollWidth;
      if (available > 0 && needed > available) {
        const ratio = available / needed;
        inner.style.transform = 'scale(' + ratio.toFixed(3) + ')';
      }
    });
  }
  function fitZoneCode() {
    shrinkToFit('.l-zone-code', '.l-zone-code-inner');
    shrinkToFit('.l-to-nameline-clip', '.l-to-nameline');
    shrinkToFit('.l-to-detail-clip', '.l-to-detail');
    // 항목18(배달점소-별칭)도 가이드 기준 18pt를 유지하되, 점소명이 길면(예: "수원아주-K18-2구역")
    // 줄바꿈되며 윗줄을 침범하던 버그(2026.10.01 실인쇄로 확인)를 같은 "넘칠 때만 축소" 방식으로 방지
    shrinkToFit('.l-footer-zone-clip', '.l-footer-zone');
  }

  async function render() {
    const singleId = getParam('orderId');
    const multiIds = getParam('orderIds');
    const contentEl = document.getElementById('content');

    const orderIds = multiIds ? multiIds.split(',').filter(Boolean) : (singleId ? [singleId] : []);
    if (!orderIds.length) { contentEl.innerHTML = '<div class="error-box">주문 정보가 없어요</div>'; return; }

    try {
      // orderId마다 개별 요청을 보내면 인쇄 건수만큼 앱스스크립트가 시트 전체를 매번 다시 읽어서
      // 여러 건을 한꺼번에 뽑을 때 응답이 느려지거나 타임아웃이 났어요. 한 번의 배치 요청으로 개선.
      const store = await api('getStoreInfo', {});
      const results = await api('getOrderDetails', { orderIds });
      let validOrders = (results || []).filter(o => o && !o.error);
      const failedCount = orderIds.length - validOrders.length;

      if (!validOrders.length) throw new Error('출력할 주문 정보를 찾을 수 없어요');

      // 합포장(같은 송장번호로 묶인 여러 주문)은 라벨 한 장으로 합쳐서 출력
      const groups = new Map();
      validOrders.forEach(o => {
        const key = String(o['송장_송장번호'] || ('__' + o['주문ID']));
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(o);
      });

      let mergedNote = '';
      validOrders = Array.from(groups.values()).map(group => {
        if (group.length === 1) return group[0];
        const items = [];
        group.forEach(o => {
          if (o['품목목록JSON']) {
            try {
              const parsed = JSON.parse(o['품목목록JSON']);
              if (Array.isArray(parsed) && parsed.length) { items.push(...parsed); return; }
            } catch (e) {}
          }
          items.push({ productName: o['상품명'] || '', quantity: o['수량'] || 1 });
        });
        const totalQty = items.reduce((sum, it) => sum + (Number(it.quantity) || 0), 0);
        mergedNote += `<div class="batch-note">합포장: ${group.map(o => o['주문ID']).join(', ')} → 송장 1건으로 합쳐짐</div>`;
        return Object.assign({}, group[0], {
          '수량': totalQty,
          '품목목록JSON': JSON.stringify(items)
        });
      });

      // 상품명 기준 정렬 (같은 상품끼리 모아서 포장하기 편하게)
      validOrders.sort((a, b) => String(a['상품명'] || '').localeCompare(String(b['상품명'] || ''), 'ko'));

      contentEl.className = '';
      let batchNote = '';
      if (validOrders.length > 1) {
        batchNote = `<div class="batch-note">총 ${validOrders.length}건 · 상품명순 정렬됨</div>`;
      }
      batchNote += mergedNote;
      if (failedCount > 0) {
        batchNote += `<div class="batch-note" style="color:#D64545; font-weight:700;">⚠ ${failedCount}건은 정보를 불러오지 못해 라벨에서 빠졌어요. 새로고침 후 다시 시도해주세요.</div>`;
      }

      contentEl.innerHTML = batchNote + validOrders.map((o, i) => renderLabel(o, store, i, validOrders.length)).join('');

      drawBarcodes(validOrders);
      fitZoneCode();
    } catch (e) {
      contentEl.className = 'error-box';
      contentEl.innerHTML = '불러오기 실패: ' + esc(e.message);
    }
  }

  render();
</script>
</body>
</html>
