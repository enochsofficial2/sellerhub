<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송장 출력 - 셀러허브</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://script.google.com">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  :root{ --ink:#111; --line:#000; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Pretendard', sans-serif; background:#EEF1F5; color:var(--ink); padding:16px; font-size:12px;}
  .toolbar{max-width:460px; margin:0 auto 14px; display:flex; gap:8px;}
  .toolbar button{flex:1; border:0; border-radius:10px; padding:12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;}
  .btn-print{background:#0F1B2E; color:#fff;}
  .btn-back{background:#fff; color:var(--ink); border:1px solid #DCE1E9 !important;}
  body.embedded .toolbar{display:none;}
  .batch-note{max-width:460px; margin:0 auto 14px; font-size:12px; color:#5C6478; text-align:center;}

  /* ===== [CJ] 표준운송장 규격 (120mm x 100mm, CJ 표준운송장 가이드 준용) ===== */
  .label{width:120mm; height:100mm; margin:0 auto 14px; background:#fff; border:1.5px solid var(--line);
    font-size:11px; display:flex; flex-direction:column; overflow:hidden; padding:2mm 3mm;}

  .l-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1.5px solid #AFCBE8; padding-bottom:1.2mm; flex-shrink:0;}
  .l-head .no-label{color:#3E7FC1; font-size:8px; font-weight:700; margin-right:1.5mm; vertical-align:top;}
  .l-head .no-value{font-weight:800; font-size:13px; letter-spacing:0.3px;}
  .l-head .date{color:#333; font-size:11px; font-weight:600;}
  .l-head .page{color:#888; font-size:9px;}

  .l-zonebar{display:flex; align-items:center; gap:3mm; padding:1.5mm 0; flex-shrink:0; min-height:14mm;}
  .l-zonebar svg{height:12mm; max-width:38%;}
  .l-zone-code{font-size:26px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap; overflow:hidden;}
  .l-zone-code .zone-sub{font-size:16px;}

  .l-block{display:flex; border-top:1px solid #ccc; flex-shrink:0;}
  .l-tag{writing-mode:vertical-rl; text-orientation:upright; font-size:9px; font-weight:700;
    background:#DCEBFA; color:#1B5FAE; border-radius:1mm; flex:0 0 5mm; width:5mm;
    margin-right:2mm; text-align:center; padding:1.5mm 0;}

  .l-to{padding:1.5mm 0;}
  .l-to-main{flex:1; min-width:0;}
  .l-to-detail-row{display:flex; align-items:center; justify-content:space-between; gap:2mm;}
  .l-to-detail{font-size:16px; font-weight:800; line-height:1.2;}
  .l-to-detail-barcode{flex-shrink:0;}
  .l-to-detail-barcode svg{height:8mm; width:24mm;}
  .l-to-nameline{font-size:11px; color:#222; margin-top:1mm; font-weight:600;}
  .l-to-fulladdr{font-size:10px; color:#444; margin-top:0.8mm; line-height:1.3;}

  .l-from{padding:1.5mm 0;}
  .l-from-main{flex:1; min-width:0;}
  .l-from-top{display:flex; justify-content:space-between; align-items:center;}
  .l-from-name{font-weight:800; font-size:12px;}
  .l-from-chips{display:flex; gap:4mm; align-items:center; font-size:10px;}
  .l-from-chips .chip-label{color:#3E7FC1; font-weight:700; margin-right:0.8mm;}
  .l-from-addr{font-size:10px; color:#333; margin-top:0.8mm;}
  .l-from-bottom{display:flex; justify-content:space-between; align-items:baseline; margin-top:0.8mm;}
  .l-from-phone{font-size:10px; color:#222; font-weight:600;}
  .l-from-recv-repeat{font-size:9px; color:#777;}

  .l-product{font-size:10px; color:#111; font-weight:600; padding:1.5mm 0; border-top:1px dashed #ccc; flex-shrink:0;}

  .l-spacer{flex:1 1 auto;}

  .l-footer{display:flex; justify-content:space-between; align-items:flex-end; border-top:1.5px solid #000; padding-top:1.5mm; flex-shrink:0;}
  .l-footer-left{flex:1; min-width:0;}
  .l-footer-detail{font-size:12px; font-weight:800;}
  .l-footer-msg{font-size:9px; color:#555; margin-top:0.5mm;}
  .l-footer-zone{font-size:10px; font-weight:700; margin-top:0.5mm;}
  .l-footer-mid{text-align:right; margin-right:3mm; flex-shrink:0;}
  .l-footer-qty{font-size:10px; font-weight:700;}
  .l-footer-page{font-size:9px; color:#888;}
  .l-footer-chips{font-size:9px; color:#3E7FC1; font-weight:700; margin-top:0.5mm;}
  .l-footer-right{text-align:center; flex-shrink:0;}
  .l-footer-right svg{height:9mm; width:34mm;}
  .l-footer-tracking{font-size:9px; letter-spacing:0.5px; margin-top:0.5mm;}

  .temp-notice{width:120mm; margin:0 auto 6px; background:#FFF6E5; color:#8a5c14; font-size:10px; font-weight:700; padding:5px 10px; text-align:center;}

  .loading, .error-box{max-width:460px; margin:40px auto; text-align:center; color:#5C6478; font-size:13px;}

  .auth-overlay{position:fixed; inset:0; background:rgba(13,20,32,0.55); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;}
  .auth-overlay.show{display:flex;}
  .auth-card{background:#fff; border-radius:16px; padding:28px 24px; max-width:300px; width:100%;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.25);}
  .auth-card .auth-brand{font-size:12px; letter-spacing:0.1em; color:#E8A33D; font-weight:700; margin-bottom:14px;}
  .auth-card h2{font-size:16px; margin:0 0 6px;}
  .auth-card p{font-size:12.5px; color:#5C6478; margin:0 0 18px;}
  #googleSignInBtn{display:flex; justify-content:center;}
  body.auth-locked > *:not(.auth-overlay){filter:blur(3px); pointer-events:none;}

  @media print {
    @page { size: 120mm 100mm; margin: 0; }
    body{background:#fff; padding:0;}
    .toolbar, .batch-note{display:none;}
    .label{border:1.5px solid #000; page-break-inside:avoid; margin:0 0 0 0;}
    .temp-notice{width:auto;}
  }
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-brand"><span class="dot"></span>SELLER HUB</div>
    <h2>로그인이 필요해요</h2>
    <p>등록된 구글 계정으로 로그인해야 주문 데이터를 볼 수 있어요</p>
    <div id="googleSignInBtn"></div>
  </div>
</div>

<div class="toolbar">
  <button class="btn-back" onclick="window.close ? window.close() : history.back()">닫기</button>
  <button class="btn-print" onclick="window.print()">🖨 인쇄하기</button>
</div>

<div id="content" class="loading">불러오는 중...</div>

<script src="common.js"></script>
<script>
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  if (getParam('embedded') === '1') {
    document.body.classList.add('embedded');
  }

  // CJ대한통운 운송장 마스킹 규칙 (송/수화인 공통 적용)
  // 이름: 두 번째 글자 마스킹, 세 글자까지만 표시 — 홍길→홍*, 홍길동→홍*동, 홍길동홍→홍*동
  function maskName(name) {
    const s = String(name || '').replace(/\s+/g, '');   // 공백은 글자 수에서 제외
    if (!s) return '-';
    if (s.length === 1) return s;
    if (s.length === 2) return s[0] + '*';
    return s[0] + '*' + s[2];
  }

  // 전화번호: 마지막 4자리 마스킹
  function maskPhone(phone) {
    const digits = String(phone || '').replace(/[^0-9]/g, '');
    if (digits.length < 8) return '-';
    const raw = String(phone);
    return raw.slice(0, raw.length - 4) + '****';
  }

  function formatTrackingDisplay(trackingNo) {
    const s = String(trackingNo || '');
    if (s.length === 12) return s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
    return s;
  }

  // CJ 가이드(FAQ 1.4.10) 권장 방식: 전체주소 앞에서 세 번째 공백 기준으로 기본주소/상세주소 분리
  // 예) "서울특별시 용산구 테스트로 123 그레이스 아파트 106동 123호"
  //     -> 기본: "서울특별시 용산구 테스트로 123" / 상세: "그레이스 아파트 106동 123호"
  function splitAddressForLabel(fullAddr) {
    const s = String(fullAddr || '').trim();
    if (!s) return { base: '', detail: '' };
    const parts = s.split(/\s+/);
    if (parts.length <= 3) return { base: s, detail: '' };
    return { base: parts.slice(0, 3).join(' '), detail: parts.slice(3).join(' ') };
  }

  // 대분류/최종지 코드(예: "5 M33-1e")와 배송구역명(예: "서울동작-E06-4구역")은
  // CJ 주소정제 API(ReqAddrRfnSm) 연동이 완료돼야 실제 값을 받을 수 있어요.
  // 아직 연동 전이라 자리(레이아웃)만 맞춰두고, 실제 값이 오기 전까진 '-'로 표시합니다.
  function getZoneInfo(order) {
    return {
      code: order['송장_구역코드'] || '',
      zoneName: order['송장_배송구역'] || ''
    };
  }

  function renderLabel(order, store, idx) {
    const trackingNo = String(order['송장_송장번호'] || '');
    const isTemp = trackingNo.indexOf('999') === 0 || trackingNo.indexOf('998') === 0;
    const isFreshTemp = trackingNo.indexOf('998') === 0;
    const carrier = order['송장_택배사'] || '택배사 미지정';
    const barcodeId = 'barcode_' + idx;
    const barcodeIdSmall = 'barcode_small_' + idx;
    const barcodeIdFooter = 'barcode_footer_' + idx;
    const dateStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\. /g, '.').replace(/\.$/, '');
    const trackingDigits = trackingNo.replace(/[^0-9]/g, '');

    const { base: toBase, detail: toDetail } = splitAddressForLabel(order['구매자주소']);
    const zone = getZoneInfo(order);
    const maskedName = maskName(order['구매자명']);
    const maskedPhone = maskPhone(order['구매자연락처']);

    let productLine = `${esc(order['상품명']) || '-'} 외 ${formatWon(order['수량'])}개`;
    if (order['품목목록JSON']) {
      try {
        const items = JSON.parse(order['품목목록JSON']);
        if (items.length > 1) {
          productLine = items.map(it => `${esc(it.productName)} x${formatWon(it.quantity)}`).join(', ');
        }
      } catch (e) {}
    }

    return `
      ${isTemp ? `<div class="temp-notice">⚠ 임시 송장번호(${isFreshTemp ? '신선배송' : '일반배송'}) - 실제 접수 시 택배사 번호로 교체돼요</div>` : ''}
      <div class="label">
        <div class="l-head">
          <div><span class="no-label">운송장번호</span><span class="no-value">${esc(formatTrackingDisplay(trackingNo)) || '-'}</span></div>
          <div class="date">${esc(dateStr)}</div>
          <div class="page">1/1</div>
        </div>

        <div class="l-zonebar">
          <svg id="${barcodeId}"></svg>
          <div class="l-zone-code">${esc(zone.code) || (carrier === 'CJ대한통운' ? 'CJ' : esc((carrier || '-').slice(0,2)))}</div>
        </div>

        <div class="l-block l-to">
          <div class="l-tag">받는분</div>
          <div class="l-to-main">
            <div class="l-to-detail-row">
              <span class="l-to-detail">${esc(toDetail) || esc(toBase) || '-'}</span>
              <span class="l-to-detail-barcode"><svg id="${barcodeIdSmall}"></svg></span>
            </div>
            <div class="l-to-nameline">${esc(maskedName)}　${esc(maskedPhone)}</div>
            <div class="l-to-fulladdr">${esc(order['구매자주소']) || '-'}</div>
          </div>
        </div>

        <div class="l-block l-from">
          <div class="l-tag">보내는분</div>
          <div class="l-from-main">
            <div class="l-from-top">
              <span class="l-from-name">${store.name ? esc(maskName(store.name)) : '(내정보에서 출고지 정보를 설정해주세요)'}</span>
              <span class="l-from-chips">
                <span><span class="chip-label">수량</span>${formatWon(order['수량'])}</span>
                <span><span class="chip-label">운임</span>0</span>
                <span><span class="chip-label">결제</span>신용</span>
              </span>
            </div>
            <div class="l-from-addr">${esc(store.address) || ''}${store.addressDetail ? ' ' + esc(store.addressDetail) : ''}</div>
            <div class="l-from-bottom">
              <span class="l-from-phone">${esc(store.phone) || '-'}</span>
              <span class="l-from-recv-repeat">받는분: ${esc(maskedName)} / ${esc(maskedPhone)}</span>
            </div>
          </div>
        </div>

        <div class="l-product">${productLine}</div>

        <div class="l-spacer"></div>

        <div class="l-footer">
          <div class="l-footer-left">
            <div class="l-footer-detail">${esc(toDetail) || esc(toBase) || '-'}</div>
            <div class="l-footer-msg">${esc(order['배송메세지']) || '문앞'}</div>
            <div class="l-footer-zone">${esc(zone.zoneName) || '-'}</div>
          </div>
          <div class="l-footer-mid">
            <div class="l-footer-qty">총수량 : ${formatWon(order['수량'])}</div>
            <div class="l-footer-page">(1/1)</div>
            <div class="l-footer-chips">운임 0　결제신용</div>
          </div>
          <div class="l-footer-right">
            <svg id="${barcodeIdFooter}"></svg>
            <div class="l-footer-tracking">${esc(trackingDigits) || '-'}</div>
          </div>
        </div>
      </div>
    `;
  }

  function drawBarcodes(orders) {
    orders.forEach((o, idx) => {
      const trackingNo = String(o['송장_송장번호'] || '');
      if (!trackingNo) return;
      [['barcode_', 1.4, 42], ['barcode_small_', 1, 24], ['barcode_footer_', 1.3, 32]].forEach(([prefix, width, height]) => {
        try {
          JsBarcode('#' + prefix + idx, trackingNo, {
            format: 'CODE128', width, height, displayValue: false, margin: 0
          });
        } catch (e) { /* 바코드로 표현 불가한 값이면 조용히 스킵 */ }
      });
    });
  }

  async function render() {
    const singleId = getParam('orderId');
    const multiIds = getParam('orderIds');
    const contentEl = document.getElementById('content');

    const orderIds = multiIds ? multiIds.split(',').filter(Boolean) : (singleId ? [singleId] : []);
    if (!orderIds.length) { contentEl.innerHTML = '<div class="error-box">주문 정보가 없어요</div>'; return; }

    try {
      const store = await api('getStoreInfo', {});
      const settled = await Promise.allSettled(orderIds.map(id => api('getOrderDetail', { orderId: id })));
      const validOrders = settled
        .filter(r => r.status === 'fulfilled' && r.value && !r.value.error)
        .map(r => r.value);
      const failedCount = orderIds.length - validOrders.length;

      if (!validOrders.length) throw new Error('출력할 주문 정보를 찾을 수 없어요');

      // 상품명 기준 정렬 (같은 상품끼리 모아서 포장하기 편하게)
      validOrders.sort((a, b) => String(a['상품명'] || '').localeCompare(String(b['상품명'] || ''), 'ko'));

      contentEl.className = '';
      let batchNote = '';
      if (validOrders.length > 1) {
        batchNote = `<div class="batch-note">총 ${validOrders.length}건 · 상품명순 정렬됨</div>`;
      }
      if (failedCount > 0) {
        batchNote += `<div class="batch-note" style="color:#D64545; font-weight:700;">⚠ ${failedCount}건은 정보를 불러오지 못해 라벨에서 빠졌어요. 새로고침 후 다시 시도해주세요.</div>`;
      }

      contentEl.innerHTML = batchNote + validOrders.map((o, i) => renderLabel(o, store, i)).join('');

      drawBarcodes(validOrders);
    } catch (e) {
      contentEl.className = 'error-box';
      contentEl.innerHTML = '불러오기 실패: ' + esc(e.message);
    }
  }

  render();
</script>
</body>
</html>
